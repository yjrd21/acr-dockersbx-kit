# syntax=docker/sandbox-kit:3
#
# Derived from the ACR SBX Kit by shelajev and contributors:
# https://github.com/shelajev/acr-sbx-kit
#
# Changes in this fork (2026):
# - Migrated Docker Sandbox Kit schema v2 to v3.
# - Replaced v2 network, credential, lifecycle, and agent-instruction fields
#   with their v3 capability equivalents.
# - Updated credential injection syntax and phase-scoped network permissions.
#
# Licensed under Apache-2.0. See LICENSE for the original copyright notice.

schemaVersion: "3"
kind: mixin
displayName: Agentic Context Registry (v3)
description: Install ACR, a package manager for GitHub-hosted agent rules, skills, scripts, and hooks.
version: "1.0.0"
sourceUrl: https://github.com/yjrd21/acr-dockersbx-kit
licenses:
  - Apache-2.0

args:
  version:
    default: "0.2.1"
    description: ACR release version to install (without a leading v)
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

capabilities:
  # GitHub release download during installation; package operations at runtime.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - github.com
          - release-assets.githubusercontent.com
          - objects.githubusercontent.com
      runtime:
        allow:
          - github.com
          - release-assets.githubusercontent.com
          - api.github.com
          - codeload.github.com
          - objects.githubusercontent.com
          - uploads.github.com

  # Optional credential for private packages, API limits, and publishing.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Optional GitHub token for ACR package operations
    config:
      service: acr-github
      phase: runtime
      apiKey:
        name: GH_TOKEN
        proxyManaged: true
        inject:
          - domain: api.github.com
            header: Authorization
            format: "Bearer %s"
          - domain: codeload.github.com
            header: Authorization
            format: "Bearer %s"
          - domain: uploads.github.com
            header: Authorization
            format: "Bearer %s"

  # Runs once when a new sandbox is created.
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - user: "0"
          description: Download ACR for the sandbox architecture, verify SHA-256, and install it
          command: |
            set -eu
            version='${{ kit.args.version }}'
            case "$(uname -m)" in
              x86_64) arch=amd64 ;;
              aarch64|arm64) arch=arm64 ;;
              *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            asset="acr-linux-${arch}.tar.gz"
            base="https://github.com/jbaruch/agentic-context-registry/releases/download/v${version}"
            work="$(mktemp -d)"
            trap 'rm -rf "$work"' EXIT
            curl -fsSL "$base/$asset" -o "$work/$asset"
            curl -fsSL "$base/checksums.txt" -o "$work/checksums.txt"
            expected="$(awk -v name="$asset" '$2 == name { print $1 }' "$work/checksums.txt")"
            test -n "$expected"
            actual="$(sha256sum "$work/$asset" | awk '{ print $1 }')"
            test "$actual" = "$expected"
            tar -xzf "$work/$asset" -C "$work" acr
            install -m 0755 "$work/acr" /usr/local/bin/acr
            acr version

  # Guidance contributed to the existing AI coding agent (not a new agent).
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        The `acr` CLI is installed. It manages GitHub-hosted packages of agent
        rules, skills, scripts, and hooks in the current project.

        Before beginning substantive work in every session, look for `agents.yaml`
        at the project root. If it exists, run these commands from that root:

            acr install --non-interactive
            acr realize

        This is mandatory project bootstrap: it reconciles declared ACR
        dependencies and materializes locked rules, skills, scripts, and hooks
        for the selected agents. If either command fails, report the failure
        and recovery guidance instead of proceeding with incomplete context.

        After realization, reread the active project instruction file, such as
        `AGENTS.md` or `CLAUDE.md`, before continuing. Use materialized skills
        when relevant. Some agents discover new skills or session-start hooks
        only when a new session begins; if that applies, tell the user a
        restart is required.

        In a project without `agents.yaml`, do not initialize ACR automatically.
        When the user asks to add an ACR package, start with
        `acr install github:OWNER/REPO`. Avoid an interactive setup prompt by
        supplying one or more supported agents (`--agent claude-code`,
        `--agent codex`, or `--agent cursor`), a freshness policy such as
        `--freshness outdated`, and `--non-interactive`. Then run `acr realize`.

        ACR writes `agents.yaml`, `.agents/registry.lock`, and agent-specific
        files into the workspace. Inspect those changes before committing.
        Run `acr help COMMAND` for command-specific options.
